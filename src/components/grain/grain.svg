<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!--
    The app's film grain (grain.css): one seamless 200px tile of colour noise,
    not mono. Each of R, G and B is its own noise channel; the matrix spreads
    each about mid grey (3x, less 1) and makes the tile opaque, so the specks
    come out red, green, blue and between. In sRGB, so mid grey stays mid grey;
    stitched, and the filter region exactly the tile, so it repeats without seams.
  -->
  <filter id="grain" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="3 0 0 0 -1  0 3 0 0 -1  0 0 3 0 -1  0 0 0 0 1" />
  </filter>
  <rect width="200" height="200" filter="url(#grain)" />
</svg>
