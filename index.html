<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norvara Intl Airport</title>
    <!--
      Boot splash styles. Inline so the splash paints before any JS loads; the
      Electron CSP allows inline styles but not inline scripts, so dismissal
      lives in src/main.tsx. Backgrounds match the page colour the app later
      paints (Fluent colorNeutralBackground5, in LumaSkyeBackground) so there
      is no flash on handoff. On Mica (data-backdrop, set by
      electron/preload.cjs) the window paints it, so they are clear.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --boot-bg: #ebebeb;
        --boot-mark: #c7c7c7;
        --boot-sheen: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #000000;
          --boot-mark: #2e2e2e;
          --boot-sheen: #575757;
        }
      }
      :root[data-backdrop] {
        --boot-bg: transparent;
      }
      body {
        background: var(--boot-bg);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        transition: opacity 240ms ease-out;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash svg {
        width: 64px;
      }
      #boot-splash .boot-splash__mark {
        fill: var(--boot-mark);
      }
      #boot-splash .boot-splash__sheen {
        animation: boot-splash-sheen 1.4s ease-in-out infinite;
      }
      #boot-splash .boot-splash__sheen-stop {
        stop-color: var(--boot-sheen);
      }
      /* Sweeps the 100-unit band from off the left edge to off the right. */
      @keyframes boot-splash-sheen {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(300px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash__sheen {
          animation: none;
          display: none;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>
  </head>

          </clipPath>
          <linearGradient id="boot-splash-sheen">
            <stop offset="0" class="boot-splash__sheen-stop" stop-opacity="0" />
            <stop offset="0.5" class="boot-splash__sheen-stop" />
